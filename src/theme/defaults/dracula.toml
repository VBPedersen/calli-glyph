[meta]
name = "Dracula"
author = "Lé God de la resistancé"
dark = true

[syntax.tokens]
keyword  = { fg = "#ff79c6", bold = true }
string   = { fg = "#f1fa8c" }
comment  = { fg = "#6272a4", italic = true }
number   = { fg = "#bd93f9" }
type     = { fg = "#8be9fd" }
function = { fg = "#50fa7b" }
boolean  = { fg = "#bd93f9" }
variable = { fg = "#f8f8f2" }
property = { fg = "#66d9ef" }
parameter = { fg = "#ffb86c" }
constant = { fg = "#bd93f9", bold = true }

[syntax.defaults]        # fallback style for any token type not listed above
fg = "#f8f8f2"

[ui.colors]
background      = "#282a36"
foreground      = "#f8f8f2"
border          = "#44475a"
border_focused  = "#bd93f9"
selection_bg    = "#44475a"
cursor          = "#f8f8f2"
status_bar_bg   = "#191a21"
status_bar_fg   = "#f8f8f2"
error           = "#ff5555"
warning         = "#f1fa8c"
info            = "#8be9fd"
hint            = "#6272a4"
success         = "#50fa7b"

[ui.components]          # optional per-widget overrides; anything omitted falls back to ui.colors
popup_bg     = "#21222c"
popup_border = "#bd93f9"

[layout]                 # non-color, structural preferences — the "styling yourself" part
border_style = "rounded"          # plain | rounded | double | thick
show_line_numbers = true
line_number_style = "absolute"    # absolute | relative | both
status_bar_position = "bottom"    # top | bottom
popup_padding = 1
scrollbar = true